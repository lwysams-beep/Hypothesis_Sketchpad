<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>電路特工：雲端修復版 v4.7</title>
    <!-- 
        Project: Circuit Hero (Class 4D Edition)
        Version: 4.7 (UX & Connectivity Fix)
        - UX: Submit button now shows "Uploading..." -> "Success" -> Resets after 5s.
        - Fix: Distinct indicator for Cloud vs Local mode to prevent data loss confusion.
    -->
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; overflow: hidden; touch-action: none; }
        .page { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }
        
        /* Login */
        .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 80%; max-width: 350px; }
        .btn-role { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 1.2rem; border: none; border-radius: 8px; cursor: pointer; color: white; transition: transform 0.1s; }
        .btn-student { background: #3498db; }
        .btn-teacher { background: #2c3e50; }
        .btn-role:active { transform: scale(0.98); }
        #student-list { width: 100%; padding: 10px; font-size: 1.1rem; margin-top: 10px; border: 2px solid #bdc3c7; border-radius: 8px; }

        /* Canvas */
        header { margin-top: 10px; text-align: center; }
        h2 { color: #2c3e50; margin: 5px 0; font-size: 1.4rem; }
        .instructions { color: #555; font-size: 1rem; margin-bottom: 5px; }
        #canvas-container { position: relative; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 12px; border: 4px solid #3498db; background: white; margin: 10px; }
        canvas { display: block; cursor: crosshair; }
        .controls { margin-top: 10px; display: flex; gap: 20px; }
        .btn-action { padding: 12px 25px; font-size: 1.1rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s; }
        .btn-clear { background-color: #95a5a6; }
        .btn-submit { background-color: #3498db; }
        
        /* Loading & Success states for button */
        .btn-submit:disabled { background-color: #95a5a6; cursor: wait; transform: none; box-shadow: none; }
        .btn-success { background-color: #2ecc71 !important; box-shadow: 0 4px 6px rgba(46, 204, 113, 0.4) !important; transform: scale(1.05); }

        /* Dashboard */
        #teacher-dashboard { width: 100%; height: 100%; background: #ecf0f1; overflow-y: auto; display: none; flex-direction: column; }
        .dash-header { background: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .dash-content { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box;}
        .stat-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .stat-row { display: flex; align-items: center; margin-bottom: 12px; }
        .stat-label { width: 130px; font-weight: bold; font-size: 1rem; color: #555; }
        .stat-bar-bg { flex-grow: 1; background: #eee; height: 20px; border-radius: 10px; overflow: hidden; margin: 0 10px; }
        .stat-bar { height: 100%; transition: width 0.5s; }
        
        .student-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        .student-table th { text-align: left; border-bottom: 2px solid #ddd; padding: 8px; color: #7f8c8d; }
        .student-table td { border-bottom: 1px solid #eee; padding: 8px; vertical-align: middle; }
        
        .tag { padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; color: white; display: inline-block; font-weight: bold; }
        .tag-A { background: #2ecc71; }
        .tag-B { background: #e74c3c; } 
        .tag-C { background: #f39c12; }

        .manual-select { padding: 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 0.85rem; background: white; cursor: pointer; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .gallery-item { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; position: relative;}
        .gallery-item:hover { transform: scale(1.05); border: 2px solid #3498db; }
        .gallery-img { width: 100%; height: 100px; object-fit: contain; background: #fff; border-bottom: 1px solid #eee; }
        .gallery-info { padding: 8px; font-size: 0.8rem; text-align: center; }

        /* Modal & Reveal Buttons */
        .btn-reveal { background: #e67e22; border: none; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); animation: pulse 2s infinite; }
        .btn-reset { background: #c0392b; border: none; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-left: 10px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Status Indicator */
        #db-status { font-size: 0.9rem; margin-top: 15px; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center;}

        /* Modals - Optimized for visibility */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9998; }
        #modal { 
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; padding: 30px; border-radius: 15px; 
            text-align: center; width: 85%; max-width: 320px; 
            z-index: 9999; box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        #modal-msg { font-size: 1.2rem; white-space: pre-wrap; line-height: 1.6; color: #2c3e50; margin: 10px 0 20px 0; font-weight: 600; }
        
        #img-modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; }
        .img-modal-content { margin: auto; display: block; max-width: 90%; max-height: 80%; border-radius: 5px; }
        #img-caption { margin: 15px 0; color: #ccc; font-size: 1.2rem; text-align: center; }
        .close-img { position: absolute; top: 15px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; }
        .btn-download { margin-top: 15px; padding: 10px 25px; background: #3498db; color: white; border: none; border-radius: 50px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="page-login" class="page active">
        <div class="login-card">
            <h2 style="margin-bottom:20px;">⚡ 電路特工登入</h2>
            <div id="student-login-area">
                <select id="student-list"><option value="" disabled selected>請選擇你的名字...</option></select>
                <button class="btn-role btn-student" onclick="loginStudent()">我是學生 🚀</button>
            </div>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <button class="btn-role btn-teacher" onclick="toggleTeacherInput()">我是老師 👨‍🏫</button>
            <div id="teacher-input-area" style="display:none; margin-top:10px;">
                <input type="password" id="teacher-pwd" placeholder="密碼" style="padding:10px; width:80%; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;">
                <button onclick="loginTeacher()" style="padding:8px 20px; background:#2c3e50; color:white; border:none; border-radius:5px;">登入</button>
            </div>
            <!-- Cloud Status Indicator -->
            <div id="db-status" style="background:#eee; color:#7f8c8d;">正在連線到雲端...</div>
        </div>
    </div>

    <div id="page-student" class="page">
        <header>
            <h2>⚡ 特工任務 (<span id="current-student-name"></span>)</h2>
            <div class="instructions">請連接「電池座」與「燈座」的圓形接點！</div>
        </header>
        <div id="canvas-container"><canvas id="circuitCanvas"></canvas></div>
        <div class="controls">
            <button class="btn-action btn-clear" onclick="clearCanvas()">重畫 🗑️</button>
            <button id="submit-btn" class="btn-action btn-submit" onclick="submitHypothesis()">提交設計 🚀</button>
        </div>
        <button onclick="logout()" style="margin-top:20px; background:none; border:none; color:#999; text-decoration:underline; cursor:pointer;">登出</button>
    </div>

    <div id="page-teacher" class="page" style="display:none; height:100vh; overflow:hidden;">
        <div id="teacher-dashboard">
            <div class="dash-header">
                <span>📊 4D班 探究數據 <span id="cloud-indicator" style="font-size:0.8rem;">...</span></span>
                <div>
                    <button id="btn-reveal-toggle" class="btn-reveal" onclick="toggleRevealMode()">🔓 揭曉真相</button>
                    <button class="btn-reset" onclick="resetData()">🗑️ 重設</button>
                    <button onclick="logout()" style="background:rgba(255,255,255,0.2); color:white; border:none; padding:8px 15px; border-radius:20px; margin-left:10px;">登出</button>
                </div>
            </div>
            <div class="dash-content">
                <div class="stat-card">
                    <h3>假說分類 (已交: <span id="submit-count">0</span>)</h3>
                    <div class="stat-row"><div class="stat-label lbl-A">A 類設計</div><div class="stat-bar-bg"><div id="t-bar-A" class="stat-bar" style="width:0%; background:#2ecc71;"></div></div><div id="t-val-A" style="width:40px; text-align:right;">0%</div></div>
                    <div class="stat-row"><div class="stat-label lbl-B">B 類設計</div><div class="stat-bar-bg"><div id="t-bar-B" class="stat-bar" style="width:0%; background:#e74c3c;"></div></div><div id="t-val-B" style="width:40px; text-align:right;">0%</div></div>
                    <div class="stat-row"><div class="stat-label lbl-C">C 類設計</div><div class="stat-bar-bg"><div id="t-bar-C" class="stat-bar" style="width:0%; background:#f39c12;"></div></div><div id="t-val-C" style="width:40px; text-align:right;">0%</div></div>
                </div>
                <div class="stat-card">
                    <h3>🔎 設計圖畫廊</h3>
                    <div style="margin-bottom:10px;">
                        <button onclick="renderGallery('all')">全部</button> 
                        <button onclick="renderGallery('A')" style="color:#2ecc71;">A類</button> 
                        <button onclick="renderGallery('B')" style="color:#e74c3c;">B類</button>
                        <button onclick="renderGallery('C')" style="color:#f39c12;">C類</button>
                    </div>
                    <div id="gallery-container" class="gallery-grid"></div>
                </div>
                <div class="stat-card">
                    <h3>📋 學生名單 (手動修正)</h3>
                    <table class="student-table">
                        <thead><tr><th>姓名</th><th>系統判定</th><th>手動歸類</th></tr></thead>
                        <tbody id="student-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay"></div>
    <div id="modal">
        <p id="modal-msg">內容</p>
        <button onclick="closeModal()" style="background:#2c3e50; color:white; padding:8px 30px; border-radius:20px; border:none; font-size:1.1rem; cursor:pointer; font-weight:bold;">收到</button>
    </div>
    <div id="img-modal">
        <span class="close-img" onclick="closeImgModal()">&times;</span>
        <img class="img-modal-content" id="img-view">
        <div id="img-caption"></div>
        <button class="btn-download" onclick="downloadImage()">📥 下載圖片</button>
    </div>

    <!-- Firebase SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, writeBatch, query, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // =======================================================
        // ✅ USER FIREBASE CONFIG (Configured for hypothesis-sketchpad)
        // =======================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDOl7CQhE5-lkz6jME_UHViSIc7UmH939o",
            authDomain: "hypothesis-sketchpad.firebaseapp.com",
            projectId: "hypothesis-sketchpad",
            storageBucket: "hypothesis-sketchpad.firebasestorage.app",
            messagingSenderId: "587015080414",
            appId: "1:587015080414:web:870c797ed5a096b863f54f"
        };
        // =======================================================

        let db = null;
        
        try {
            if (firebaseConfig.apiKey) {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                console.log("Firebase initialized");
                
                // Update UI to show connection success
                const statusEl = document.getElementById('db-status');
                statusEl.innerText = "🟢 雲端連線成功 (資料會自動儲存)";
                statusEl.style.backgroundColor = "#e8f8f5";
                statusEl.style.color = "#27ae60";
            }
        } catch (e) {
            console.error("Firebase init failed:", e);
            const statusEl = document.getElementById('db-status');
            statusEl.innerText = "🔴 連線失敗！將使用單機模式 (關閉後資料消失)";
            statusEl.style.backgroundColor = "#fdedec";
            statusEl.style.color = "#c0392b";
        }

        window.firebaseDB = db;
        window.firestoreOps = { collection, doc, setDoc, getDoc, onSnapshot, writeBatch, query, getDocs };
    </script>

    <script>
        // === Main Logic ===
        let currentUser = "";
        let hasSubmittedBefore = false; // Session tracking
        let submissions = [];
        let isRevealMode = false;
        const PASSWORD = "61513110";
        const students = [            "1. 陳希兒", "2. 陳芯怡", "3. 陳煥一", "4. 鄭君亭", "5. 張峻謙",
            "6. 周晴", "7. 周思潁", "8. 鍾熙雯", "9. 許健樂", "10. 梁津瑜",
            "11. 李思語", "12. 劉宇軒", "13. 孟詩晴", "14. 潘芷瑩", "15. 潘裕翔", 
            "16. 曾柏森", "17. 曾子晴", "18. 王耀輝", "19. 黃煒喬", "20. 黃湙阩",
            "21. 胡滙琦", "22. 熊永楓", "23. 朱彥銘"];

        window.onload = function() { initStudentList(); drawComponents(); };

        function initStudentList() {
            const select = document.getElementById('student-list');
            students.forEach(name => { let opt = document.createElement('option'); opt.value = name; opt.innerText = name; select.appendChild(opt); });
        }
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const p = document.getElementById(pageId); p.classList.add('active'); p.style.display = 'flex';
            if(pageId === 'page-teacher') document.getElementById('teacher-dashboard').style.display = 'flex';
        }
        function logout() { currentUser = ""; hasSubmittedBefore = false; clearCanvas(); document.getElementById('teacher-pwd').value = ""; isRevealMode=false; showPage('page-login'); }
        
        // --- Login Logic ---
        async function loginStudent() {
            const name = document.getElementById('student-list').value;
            if(!name) { alert("請先選擇名字！"); return; }
            currentUser = name; document.getElementById('current-student-name').innerText = name; 
            
            hasSubmittedBefore = false;
            
            // Check status in DB or Local
            if (window.firebaseDB) {
                try {
                    const { doc, getDoc } = window.firestoreOps;
                    const docRef = doc(window.firebaseDB, "submissions", name);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) hasSubmittedBefore = true;
                } catch(e) { console.error("Check status failed", e); }
            } else {
                if(submissions.find(s => s.name === name)) hasSubmittedBefore = true;
            }

            if(hasSubmittedBefore) {
                showModal("你之前已經提交過設計。\n您可以重新繪畫並提交，新設計將會覆蓋舊的記錄。");
            }

            showPage('page-student');
            setTimeout(drawComponents, 100);
        }

        function toggleTeacherInput() { const div = document.getElementById('teacher-input-area'); div.style.display = div.style.display === 'none' ? 'block' : 'none'; }
        
        function loginTeacher() {
            if(document.getElementById('teacher-pwd').value === PASSWORD) {
                if (window.firebaseDB) {
                    startRealtimeListener();
                    document.getElementById('cloud-indicator').innerText = "(🟢 雲端同步中)";
                    document.getElementById('cloud-indicator').style.color = "#2ecc71";
                } else {
                    if(submissions.length === 0 && !sessionStorage.getItem('resetHappened')) { generateMockData(); }
                    document.getElementById('cloud-indicator').innerText = "(🟠 單機演示模式)";
                    document.getElementById('cloud-indicator').style.color = "#f39c12";
                }
                updateDashboard(); showPage('page-teacher');
            } else { alert("密碼錯誤！"); }
        }

        // === Submit Logic with BUTTON FEEDBACK ===
        async function submitHypothesis() {
            const btn = document.getElementById('submit-btn');
            const originalText = "提交設計 🚀";
            
            // 1. Loading State
            btn.innerText = "⏳ 正在上載...";
            btn.disabled = true;

            // Wait a little bit to let user see "Uploading" (UX)
            await new Promise(r => setTimeout(r, 800));

            try {
                const res = analyzeCircuit(); 
                const dataURL = canvas.toDataURL(); 
                const record = { name: currentUser, type: res.type, img: dataURL, timestamp: Date.now() };

                // Determine message
                let msg = "";
                if (hasSubmittedBefore) {
                    msg = `✅ 更新成功！\n\n⚠️ 舊的設計已被新設計覆蓋。\n分類結果：【 ${res.type} 類 】`;
                } else {
                    msg = `✅ 提交成功！\n\n系統已收到你的設計。\n分類結果：【 ${res.type} 類 】`;
                }

                // Upload Logic
                if (window.firebaseDB) {
                    const { doc, setDoc } = window.firestoreOps;
                    await setDoc(doc(window.firebaseDB, "submissions", currentUser), record);
                    showModal(msg);
                    hasSubmittedBefore = true; 
                } else {
                    const idx = submissions.findIndex(s => s.name === currentUser);
                    if(idx >= 0) submissions.splice(idx, 1);
                    submissions.push(record);
                    showModal(msg + " (單機)");
                    hasSubmittedBefore = true;
                }

                // 2. Success State on Button
                btn.innerText = "✅ 上載成功！";
                btn.classList.add('btn-success');
                btn.disabled = false; // Enable again but keep success style temporarily

                // 3. Reset Button after 5 seconds (Requested by user)
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('btn-success');
                }, 5000);

            } catch (e) {
                console.error(e);
                alert("程式發生錯誤：" + e.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function startRealtimeListener() {
            if (!window.firebaseDB) return;
            const { collection, onSnapshot, query } = window.firestoreOps;
            const q = query(collection(window.firebaseDB, "submissions"));
            onSnapshot(q, (snapshot) => {
                submissions = [];
                snapshot.forEach((doc) => {
                    submissions.push(doc.data());
                });
                updateDashboard();
            });
        }

        async function resetData() {
            if(!confirm("確定要重設所有數據嗎？")) return;
            if (window.firebaseDB) {
                const { collection, getDocs, writeBatch } = window.firestoreOps;
                const batch = writeBatch(window.firebaseDB);
                const snapshot = await getDocs(collection(window.firebaseDB, "submissions"));
                snapshot.forEach((d) => { batch.delete(d.ref); });
                await batch.commit();
                alert("雲端數據已清空。");
            } else {
                submissions = []; sessionStorage.setItem('resetHappened', 'true'); updateDashboard(); alert("單機數據已清空。");
            }
        }

        async function overrideType(studentName, newType) {
            const entry = submissions.find(s => s.name === studentName);
            if(entry) { entry.type = newType; updateDashboard(); }
            if (window.firebaseDB) {
                const { doc, setDoc } = window.firestoreOps;
                await setDoc(doc(window.firebaseDB, "submissions", studentName), { type: newType }, { merge: true });
            }
        }

        function generateMockData() {
            const types = ['A', 'A', 'B', 'C', 'C'];
            students.forEach((name, index) => {
                if(index < 25) { 
                    const idx = submissions.findIndex(s => s.name === name);
                    if(idx === -1) { submissions.push({ name: name, type: types[Math.floor(Math.random() * types.length)], img: null }); }
                }
            });
        }

        // === Canvas Logic ===
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        const w = Math.min(window.innerWidth * 0.95, 600);
        const h = 350;
        canvas.width = w; canvas.height = h;
        const batteryHolderPos = { x: 50, y: h/2 - 30, w: 100, h: 60 }; 
        const bulbPos = { x: w - 130, y: h/2 - 50, w: 80, h: 80 }; 
        let isDrawing = false, lastX = 0, lastY = 0;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }
        function start(e) { isDrawing = true; const pos = getPos(e); lastX = pos.x; lastY = pos.y; e.preventDefault(); }
        function end() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#e74c3c'; 
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            lastX = pos.x; lastY = pos.y; e.preventDefault();
        }
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mouseup', end); canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchend', end); canvas.addEventListener('touchmove', draw, {passive: false});

        function drawComponents() {
            ctx.strokeStyle = "#333333"; ctx.lineWidth = 2; 
            ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = "white"; ctx.fillRect(0,0,canvas.width, canvas.height); ctx.globalCompositeOperation = 'source-over';

            const bx = batteryHolderPos.x, by = batteryHolderPos.y, bw = batteryHolderPos.w, bh = batteryHolderPos.h;
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(bx - 10, by - 5, bw + 20, bh + 10);
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(bx, by + 5, bw, bh - 10);
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(bx + bw, by + 15, 8, 30);
            ctx.fillStyle = '#95a5a6'; ctx.fillRect(bx - 25, by + 10, 15, bh - 20);
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(bx + bw + 10, by + 10, 15, bh - 20);
            ctx.fillStyle = '#000'; ctx.font = 'bold 24px Arial'; ctx.fillText("-", bx - 20, by + 38); ctx.fillStyle = '#fff'; ctx.fillText("+", bx + bw + 12, by + 38);
            ctx.fillStyle = '#000'; ctx.font = '14px Arial'; ctx.fillText("電池座", bx + 25, by + 85);

            const lux = bulbPos.x + 40, luy = bulbPos.y + 30, holderY = luy + 35;
            ctx.fillStyle = '#34495e'; ctx.fillRect(lux - 50, holderY, 100, 25);
            ctx.fillStyle = '#bdc3c7'; ctx.beginPath(); ctx.arc(lux - 35, holderY + 12.5, 8, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(lux + 35, holderY + 12.5, 8, 0, Math.PI*2); ctx.fill(); 
            ctx.fillStyle = '#95a5a6'; ctx.fillRect(lux - 15, luy + 15, 30, 20);
            ctx.beginPath(); ctx.arc(lux, luy, 30, 0, Math.PI * 2); ctx.fillStyle = '#fff176'; ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#000'; ctx.fillText("燈座", lux - 15, holderY + 45);
        }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); drawComponents(); }
        function checkZone(x, y, w, h) {
            const data = ctx.getImageData(x, y, w, h).data;
            for (let i = 0; i < data.length; i += 4) { if (data[i] > 200 && data[i+1] < 100) return true; }
            return false;
        }

        function analyzeCircuit() {
            const bx = batteryHolderPos.x, by = batteryHolderPos.y, bw = batteryHolderPos.w;
            const hasBattPos = checkZone(bx + bw + 5, by, 30, 60);
            const hasBattNeg = checkZone(bx - 30, by, 30, 60);
            const lux = bulbPos.x + 40;
            const holderY = bulbPos.y + 30 + 35;
            const hasBulbLeft = checkZone(lux - 45, holderY, 20, 25); 
            const hasBulbRight = checkZone(lux + 25, holderY, 20, 25);
            const hasBulbBody = checkZone(bulbPos.x + 5, bulbPos.y + 5, 70, 50); 
            const hasDangerZone = checkZone(bx, by - 60, bw + 40, 40);

            let type = "C"; 
            if (!hasBattPos || !hasBattNeg) { type = "C"; } else {
                if (hasBulbBody) { type = "C"; } 
                else if (hasDangerZone) { type = "B"; }
                else if ((hasBulbLeft && !hasBulbRight) || (!hasBulbLeft && hasBulbRight)) { type = "B"; } 
                else if (hasBulbLeft && hasBulbRight) { type = "A"; } 
                else { type = "C"; }
            }
            return { type: type };
        }

        // === Dashboard ===
        function toggleRevealMode() {
            isRevealMode = !isRevealMode;
            const btn = document.getElementById('btn-reveal-toggle');
            if(isRevealMode) { btn.innerText = "🔒 隱藏答案"; btn.style.background = "#7f8c8d"; } 
            else { btn.innerText = "🔓 揭曉真相"; btn.style.background = "#e67e22"; }
            updateDashboard();
        }
        function getLabel(type) {
            if (!isRevealMode) return type + " 類設計";
            const map = { 'A': '⭕ A類 (閉合成功)', 'B': '⚡ B類 (短路危險)', 'C': '❓ C類 (斷路/錯誤)' };
            return map[type];
        }
        function updateDashboard() {
            let counts = { A: 0, B: 0, C: 0 };
            submissions.forEach(s => counts[s.type]++);
            const total = submissions.length;
            document.getElementById('submit-count').innerText = total;
            const safeTotal = total || 1; 
            updateBar('t', counts.A, safeTotal, 'A'); updateBar('t', counts.B, safeTotal, 'B'); updateBar('t', counts.C, safeTotal, 'C');
            document.querySelector('.lbl-A').innerText = getLabel('A'); document.querySelector('.lbl-B').innerText = getLabel('B'); document.querySelector('.lbl-C').innerText = getLabel('C');
            
            const tbody = document.getElementById('student-table-body'); tbody.innerHTML = "";
            submissions.forEach(s => { 
                const selectHTML = `<select class="manual-select" onchange="overrideType('${s.name}', this.value)">
                        <option value="A" ${s.type==='A'?'selected':''}>A類</option>
                        <option value="B" ${s.type==='B'?'selected':''}>B類</option>
                        <option value="C" ${s.type==='C'?'selected':''}>C類</option></select>`;
                tbody.innerHTML += `<tr><td>${s.name}</td><td>${getTypeTag(s.type)}</td><td>${selectHTML}</td></tr>`; 
            });
            renderGallery('all');
        }
        function updateBar(p, v, t, k) { const pct = (t === 0) ? "0%" : Math.round((v/t)*100)+"%"; document.getElementById(`${p}-bar-${k}`).style.width = pct; document.getElementById(`${p}-val-${k}`).innerText = pct; }
        function getTypeTag(t) { const label = getLabel(t); const c = {'A':'tag-A', 'B':'tag-B', 'C':'tag-C'}; return `<span class="tag ${c[t]}">${label}</span>`; }
        function renderGallery(f) {
            const c = document.getElementById('gallery-container'); c.innerHTML = "";
            const d = f === 'all' ? submissions : submissions.filter(s => s.type === f);
            if(d.length===0) { c.innerHTML="<div style='color:#999;grid-column:1/-1;text-align:center;'>無資料</div>"; return; }
            d.forEach(s => {
                let img = s.img ? s.img : "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjBmMGYwIi8+PC9zdmc+";
                let item = document.createElement('div'); item.className = 'gallery-item';
                item.onclick = function() { openImgModal(img, s.name, s.type); };
                item.innerHTML = `<img src="${img}" class="gallery-img"><div class="gallery-info"><b>${s.name}</b><br>${getTypeTag(s.type)}</div>`;
                c.appendChild(item);
            });
        }
        function openImgModal(src, name, type) { document.getElementById('img-modal').style.display = "flex"; const img = document.getElementById('img-view'); img.src = src; img.dataset.name = name; document.getElementById('img-caption').innerText = `${name} (${getLabel(type)})`; }
        function closeImgModal() { document.getElementById('img-modal').style.display = "none"; }
        function downloadImage() { const img = document.getElementById('img-view'); const link = document.createElement('a'); link.download = `電路設計_${img.dataset.name}.png`; link.href = img.src; document.body.appendChild(link); link.click(); document.body.removeChild(link); }
        window.onclick = function(event) { if (event.target == document.getElementById('img-modal')) closeImgModal(); }
        
        // --- Show Modal Function ---
        function showModal(m) { 
            const overlay = document.getElementById('modal-overlay');
            const modal = document.getElementById('modal');
            overlay.style.display='block'; 
            modal.style.display='block'; 
            document.getElementById('modal-msg').innerText=m; 
        }
        function closeModal() { document.getElementById('modal-overlay').style.display='none'; document.getElementById('modal').style.display='none'; }
    </script>
</body>
</html>
